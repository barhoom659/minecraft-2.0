<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="home-screen">
            <h1>Minecraft 3D</h1>
            <button id="start-btn">Start Game</button>
            <button id="settings-btn">Settings</button>
        </div>
        <div id="ui">
            <button id="fullscreen-btn">Full Screen</button>
            <div id="health">♥♥♥♥♥♥♥♥♥♥</div>
            <div id="inventory">
                <button id="grass-btn" class="block-btn selected">Grass</button>
                <button id="dirt-btn" class="block-btn">Dirt</button>
                <button id="stone-btn" class="block-btn">Stone</button>
                <button id="wood-btn" class="block-btn">Wood</button>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
